{% load i18n %}
<section id="club" class="mx-auto mt-28 max-w-7xl px-4 md:mt-36 md:px-8">
  <div class="grid overflow-hidden bg-blush md:grid-cols-2">
    <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1200&q=80" alt="" loading="lazy" class="h-64 w-full object-cover md:h-full">
    <div class="px-6 py-14 md:px-14 md:py-20">
      <p class="eyebrow !text-wine">{% translate "The Escale club" %}</p>
      <h2 class="display mt-3 text-4xl md:text-5xl">{% translate "Be the first to know" %}</h2>
      <p class="mt-4 max-w-md leading-relaxed text-ink/75">
        {% translate "New private sales every Thursday at 10:00. Join for free and receive them before anyone else." %}
      </p>
      <form action="{% url 'stays:subscribe' %}" method="post" class="mt-8 flex flex-col gap-3 sm:flex-row">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}#club">
        <input type="email" name="email" required placeholder="{% translate 'Your email address' %}"
               class="w-full flex-1 border border-ink/20 bg-ivory px-5 py-3.5 text-sm outline-none focus:border-ink">
        <button class="btn-dark">{% translate "Join for free" %}</button>
      </form>
      <p class="mt-3 text-xs text-ink/50">{% translate "No spam. Unsubscribe in one click." %}</p>
    </div>
  </div>
</section>
