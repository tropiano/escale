# Appliku deployment config. Reference: https://docs.appliku.com/docs/reference/appliku-yml-reference/
build_settings:
  build_image: python-3.13
  container_port: 8000
  environment_variables:
    - name: DATABASE_URL
      from_database:
        name: db
        property: private_connection_url
    - name: ALLOWED_HOSTS          # filled with the app's Appliku domains
      from_domains: true
    - name: SECRET_KEY             # set this one by hand in the Appliku dashboard
      source: manual
    - name: DEBUG
      value: "False"

services:
  web:
    command: bash bin/web.sh
    scale: 1
  release:                         # runs once after each deploy
    command: bash bin/release.sh

databases:
  db:
    type: postgresql_17
